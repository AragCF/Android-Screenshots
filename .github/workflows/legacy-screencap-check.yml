name: Temporary legacy screencap check

on:
  push:
    branches:
      - legacy-screencap-fix-20260927

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test legacy geometry guard
        run: |
          python -m py_compile android_screenshot_tool.py
          python android_screenshot_tool.py --version
          python - <<'PY'
          import android_screenshot_tool as m
          assert m._legacy_capture_geometry_is_stale((800, 1280), (1280, 800)) is True
          assert m._legacy_capture_geometry_is_stale((1280, 800), (1280, 800)) is False
          assert m._legacy_capture_geometry_is_stale((480, 480), (480, 480)) is False
          print("legacy geometry guard: OK")
          PY
