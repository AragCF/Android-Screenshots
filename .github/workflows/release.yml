name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(python - <<'PYCODE'
          import re
          from pathlib import Path
          text = Path('android_screenshot_tool.py').read_text(encoding='utf-8')
          m = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"', text, re.M)
          if not m:
              raise SystemExit('APP_VERSION not found')
          print(m.group(1))
          PYCODE
          )"
          echo "Tag: $VERSION"
          echo "App: $APP_VERSION"
          test "$VERSION" = "$APP_VERSION"
          python -m py_compile android_screenshot_tool.py
          python android_screenshot_tool.py --version | grep -F "$VERSION"

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=10.0" "PyInstaller>=6.0"
          python -m PyInstaller --noconfirm --clean --onefile --console --name AndroidScreenshotTool android_screenshot_tool.py
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force release | Out-Null
          $target = "release/AndroidScreenshotTool-v$version-windows-x64.exe"
          Move-Item "dist/AndroidScreenshotTool.exe" $target
          & $target --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe
          if-no-files-found: error

  debian:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build DEB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=10.0" "PyInstaller>=6.0"
          VERSION="${GITHUB_REF_NAME#v}"
          APP="android-screenshot-tool"
          ARCH="$(dpkg --print-architecture)"
          python -m PyInstaller --noconfirm --clean --onefile --console --name "$APP" android_screenshot_tool.py
          ./dist/"$APP" --version | grep -F "$VERSION"
          PKG="build/deb/${APP}_${VERSION}_${ARCH}"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" release
          install -m 0755 "dist/$APP" "$PKG/usr/bin/$APP"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: $APP
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $ARCH
          Maintainer: AragCF
          Description: Interactive ADB screenshot utility for Android devices
           Captures Android screenshots through adb, supports USB and network devices,
           PNG and JPEG quality 99, keyboard navigation and timestamped filenames.
          EOF
          DEB="release/${APP}_${VERSION}_${ARCH}.deb"
          dpkg-deb --build --root-owner-group "$PKG" "$DEB"
          dpkg-deb --info "$DEB"
          sudo dpkg -i "$DEB"
          android-screenshot-tool --version | grep -F "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: release/*.deb
          if-no-files-found: error

  source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean source ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          git archive --format=zip --prefix="Android-Screenshot-Tool-v${VERSION}/" -o "release/Android-Screenshot-Tool-v${VERSION}-source.zip" HEAD
          unzip -l "release/Android-Screenshot-Tool-v${VERSION}-source.zip"
          if unzip -l "release/Android-Screenshot-Tool-v${VERSION}-source.zip" | grep -E '(__pycache__|Screenshots/|\.venv|/dist/|/build/)'; then
            echo "Forbidden local/build content found in source archive"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: release/*-source.zip
          if-no-files-found: error

  release:
    needs: [windows, debian, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum *.exe *.deb *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Android Screenshot Tool $VERSION" --generate-notes
