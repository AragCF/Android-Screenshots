name: Temporary 1.1.5 capture modes check

on:
  push:
    branches:
      - jl22-fix-altf4-20261005

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate mode model
        run: |
          python -m py_compile android_screenshot_tool.py
          python android_screenshot_tool.py --version | grep -F "1.1.5"
          python - <<'PY'
          import android_screenshot_tool as m
          assert m.SCREENSHOT_CAPTURE_MODES == ("auto", "stream", "file", "screenrecord")
          s = dict(m.DEFAULT_SETTINGS)
          s["screenshot_capture_modes"] = {"x": "bogus", "y": "screenrecord"}
          assert "screenshot_capture_modes" in s
          stale = bytes.fromhex("")
          assert "0bafc5252f4474e58d26dfca14a07201bd5bc8b7af6a14bf0b2b025778c3e711" in m.KNOWN_STALE_SCREENCAP_SHA256
          print("capture mode model: OK")
          PY

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Windows close plumbing
        shell: pwsh
        run: |
          python -m py_compile android_screenshot_tool.py
          @'
          import android_screenshot_tool as m
          assert m.install_windows_console_close_handler() in (True, False)
          m.APP_EXIT_REQUESTED.clear()
          m.request_app_exit()
          assert m.read_key_timeout(0.1) == m.Key.CLOSE
          print("Windows close plumbing: OK")
          '@ | Set-Content -Encoding utf8 test_close.py
          python test_close.py
