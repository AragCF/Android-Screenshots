name: Temporary restore screencap check

on:
  push:
    branches:
      - restore-screencap-20260927

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and version
        run: |
          python -m py_compile android_screenshot_tool.py
          python android_screenshot_tool.py --version
